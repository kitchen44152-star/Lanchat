name: build
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test-and-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v6
        with: { gradle-version: 9.3.1 }
      - name: Debug keystore (throwaway, CI only)
        run: keytool -genkeypair -keystore debug.keystore -storepass android -keypass android -alias androiddebugkey -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
      - run: gradle :app:testDebugUnitTest :app:assembleDebug
      - uses: actions/upload-artifact@v7
        with: { name: lanchat-debug-apk, path: app/build/outputs/apk/debug/*.apk }
