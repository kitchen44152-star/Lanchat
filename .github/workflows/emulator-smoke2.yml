name: emulator-smoke2
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/emulator-smoke2.yml'
      - '.github/scripts/smoke2.sh'
      - '.github/scripts/ui.py'
permissions:
  contents: read
jobs:
  two-emulators:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Two-emulator smoke test
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/smoke2.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emu-smoke2
          path: emu-out2/
